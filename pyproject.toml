[project]
name = "image-validator"
version = "0.1.0"
description = "Image file validation: format, size, dimensions, aspect ratio, corruption check"
requires-python = ">=3.11"
readme = "README.md"
authors = [{ name = "faraday208" }]
keywords = ["image", "validation", "dataset", "preprocessing", "ai"]
dependencies = [
    "pillow>=10.0.0",
    "pyyaml>=6.0",
    "tqdm>=4.65.0",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true
