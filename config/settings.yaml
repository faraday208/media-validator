# Image Validator Configuration
# CLI + library kullanımı için ayarlar

# Dosya Validasyonu
file_validation:
  allowed_formats:
    - jpg
    - jpeg
    - png
    - webp
  min_file_size_kb: 100       # 100KB altı muhtemelen bozuk/thumbnail
  max_file_size_mb: 50        # 50MB üzeri muhtemelen raw

# Boyut Kontrolleri
dimensions:
  min_short_edge: 512         # SDXL minimum
  max_short_edge: 8192        # Çok büyük = gereksiz
  aspect_ratio:
    min: 0.5                  # 1:2 (dikey limit)
    max: 2.0                  # 2:1 (yatay limit)
