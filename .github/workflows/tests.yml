name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: uv kur
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Testleri koş
        run: uv run --python ${{ matrix.python-version }} --with pytest pytest -q
